<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site | Alloy Ready</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101513;
        color: #f3f6f4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #101513;
      }

      main {
        width: min(680px, 100%);
        padding: clamp(32px, 8vw, 72px);
        border: 1px solid #344139;
        border-radius: 24px;
        background: #18201c;
        box-shadow: 0 24px 80px rgb(0 0 0 / 35%);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 24px;
        color: #a9d9ba;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .status::before {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #5fd38b;
        content: "";
        box-shadow: 0 0 0 5px rgb(95 211 139 / 12%);
      }

      h1 {
        max-width: 10ch;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(3rem, 10vw, 6.5rem);
        font-weight: 400;
        letter-spacing: -0.06em;
        line-height: 0.88;
      }

      p {
        max-width: 48ch;
        margin: 28px 0 0;
        color: #bdc8c0;
        font-size: clamp(1rem, 2.5vw, 1.15rem);
        line-height: 1.65;
      }

      code {
        color: #d3f5df;
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="status">Alloy session online</div>
      <h1>Ready to build.</h1>
      <p>
        This repository now runs in Docker and is available through the Alloy preview. Start editing
        <code>index.html</code> to shape the site.
      </p>
    </main>
  </body>
</html>
